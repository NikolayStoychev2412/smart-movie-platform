services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moviemaze
      POSTGRES_USER: moviemaze
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviemaze -d moviemaze"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override DATABASE_URL to point at the postgres container
      DATABASE_URL: postgresql+asyncpg://moviemaze:${POSTGRES_PASSWORD}@postgres:5432/moviemaze
      CORS_ORIGINS: "https://movie-maze-cyan.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
    volumes:
      - ./data:/app/data      # FAISS index persists across rebuilds
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - external

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - external

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:   # postgres <-> api  (not exposed to the internet)
    driver: bridge
  external:   # api <-> caddy     (caddy faces the internet)
    driver: bridge
